<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulse Player</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#140f0d">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23ff5a36'/%3E%3Cpath d='M200 140v190a50 50 0 1 0 30 46V210l120-30v110a50 50 0 1 0 30 46V110z' fill='%23140f0d'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23ff5a36'/%3E%3Cpath d='M200 140v190a50 50 0 1 0 30 46V210l120-30v110a50 50 0 1 0 30 46V110z' fill='%23140f0d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
<symbol id="i-shuf" viewBox="0 0 24 24"><path d="M10.6 9.2L5 3.6 3.6 5l5.6 5.6zM14.5 4l2 2L3.6 19 5 20.4 18 7.5l2 2V4zm.7 9.8l-1.4 1.4 3.2 3.2-2 2H20v-5.5l-2 2z"/></symbol>
<symbol id="i-rep" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.2z"/></symbol>
<symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm13 0v6l5-3z"/></symbol>
<symbol id="i-eq" viewBox="0 0 24 24"><path d="M4 10h3v10H4zm6-6h3v16h-3zm6 8h3v8h-3z"/></symbol>
<symbol id="i-tim" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15 1H9v2h6zm-3 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 9h-2V9h2z"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm12 0l-1.4 1.4 1.6 1.6-1.6 1.6L15 15l1.6-1.6L18.2 15l1.4-1.4-1.6-1.6 1.6-1.6L18.2 9l-1.6 1.6z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7z"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
</defs></svg>
<div id="app">
<header><h1>Pulse</h1><div class="hr"><button id="btnInstall" class="pill" hidden>Install app</button><button id="btnAdd" class="ic" aria-label="Add music"><svg class="i"><use href="#i-plus"/></svg></button></div></header>
<div class="bar"><input id="search" type="search" placeholder="Search title, artist, album"><select id="sort" aria-label="Sort"><option value="added">Recent</option><option value="az">A–Z</option><option value="artist">Artist</option><option value="dur">Duration</option></select></div>
<main id="list"></main></div>
<div id="mini" hidden><div class="th" id="mArt"></div><div class="mi"><div class="mt" id="mT"><span></span></div><small id="mA"></small></div>
<button class="ic" id="mPlay" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button><button class="ic" id="mNext" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button></div>
<nav id="tabs"><button data-t="songs" class="on">Songs</button><button data-t="favs">Favorites</button><button data-t="lists">Playlists</button><button data-t="albums">Albums</button><button data-t="artists">Artists</button></nav>
<section id="np" aria-label="Now playing">
<button class="grab" id="bClose" aria-label="Minimize"><svg class="i"><use href="#i-down"/></svg></button>
<div id="npArt"></div><canvas id="viz" width="320" height="56"></canvas>
<div class="tt"><b id="npT"></b><small id="npA"></small></div>
<input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Seek"><div class="tm"><small id="tCur">0:00</small><small id="tDur">0:00</small></div>
<div class="ctl"><button class="ic" id="bShuf" aria-label="Shuffle"><svg class="i"><use href="#i-shuf"/></svg></button><button class="ic" id="bPrev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button><button class="ic big" id="bPlay" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button><button class="ic" id="bNext" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button><button class="ic" id="bRep" aria-label="Repeat" data-m="0"><svg class="i"><use href="#i-rep"/></svg></button></div>
<div class="ctl q"><button class="ic" id="bStop" aria-label="Stop"><svg class="i"><use href="#i-stop"/></svg></button><button class="ic" id="bFav" aria-label="Favorite"><svg class="i"><use href="#i-heart"/></svg></button><button class="ic" id="bSpd">1x</button><button class="ic" id="bEq" aria-label="Equalizer"><svg class="i"><use href="#i-eq"/></svg></button><button class="ic" id="bTim" aria-label="Sleep timer"><svg class="i"><use href="#i-tim"/></svg></button><button class="ic" id="bQ" aria-label="Queue"><svg class="i"><use href="#i-queue"/></svg></button></div>
<div class="vr"><button class="ic" id="bMute" aria-label="Mute"><svg class="i"><use href="#i-vol"/></svg></button><input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div><small id="slp"></small>
</section>
<div class="sh" id="md"><div class="sc"><h3 id="mdT"></h3><div id="mdB"></div></div></div>
<div class="sh" id="qd"><div class="sc"><h3>Up next</h3><div id="qB"></div></div></div>
<div id="toast"></div>
<input type="file" id="fFiles" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" multiple hidden>
<input type="file" id="fDir" webkitdirectory multiple hidden>
<script src="app.js"></script></body></html>
